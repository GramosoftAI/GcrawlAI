name: 🐛 Bug Report
description: Create a report to help us fix a crawling or extraction issue
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in GcrawlAI! Please search existing issues before submitting.
  - type: input
    id: target_url
    attributes:
      label: Target URL
      description: The URL you were attempting to scrape or crawl.
      placeholder: https://example.com/protected-page
    validations:
      required: true
  - type: dropdown
    id: endpoint
    attributes:
      label: API Endpoint / Feature
      options:
        - POST /api/v1/scrape
        - POST /api/v1/crawl
        - POST /api/v1/map
        - POST /api/v1/screenshot
        - POST /api/v1/scrape/offline-bundle
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Error Logs
      description: Please provide error messages, HTTP status codes, or tracebacks.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Self-hosted or Cloud API?
      placeholder: Ubuntu 22.04, Python 3.11, Self-Hosted Docker
    validations:
      required: false
